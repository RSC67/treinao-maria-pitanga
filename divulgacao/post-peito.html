<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Conceito: número de peito de corrida. Fundo pitanga, peito creme no centro; o "número" é a data de abertura. */
:root{--acai:#26092f;--pitanga:#ff5a36;--creme:#fbefe6;--tinta-2:#6b4a74;--borda:#e6cfc4;
  --display:"Unbounded","Arial Black",sans-serif;--body:"Figtree",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{width:1080px;height:1350px;background:var(--pitanga);color:var(--acai);font-family:var(--body);overflow:hidden}
.post{position:relative;width:1080px;height:1350px;padding:64px 72px;display:flex;flex-direction:column;align-items:center;
  background:repeating-linear-gradient(-45deg,transparent 0 46px,rgba(255,255,255,.06) 46px 92px),var(--pitanga)}
.topo{width:100%;display:flex;justify-content:space-between;align-items:center;color:#fff}
.marca{font-family:var(--display);font-weight:700;font-size:32px}
.marca small{display:block;font-family:var(--body);font-weight:700;font-size:19px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-top:2px}
.gratis{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.08em;text-transform:uppercase;background:var(--acai);color:#fff;border-radius:999px;padding:12px 22px}
.peito{margin-top:60px;width:920px;background:var(--creme);border-radius:34px;box-shadow:0 30px 60px -28px rgba(38,9,47,.55);transform:rotate(-2.2deg);overflow:hidden}
.peito-topo{background:var(--acai);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:24px 34px}
.peito-topo span{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.1em;text-transform:uppercase}
.furo{width:26px;height:26px;border-radius:50%;background:var(--pitanga);box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.peito-corpo{padding:38px 48px 42px;display:flex;flex-direction:column;align-items:center;text-align:center}
.rotulo{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-2)}
.numero{font-family:var(--display);font-weight:900;font-size:236px;line-height:.9;letter-spacing:-.04em;color:var(--acai);margin:14px 0 4px}
.numero i{font-style:normal;color:var(--pitanga)}
.amanha{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--pitanga);text-transform:uppercase;letter-spacing:-.01em}
.corte{width:100%;border-top:3px dashed var(--borda);margin:34px 0 28px}
.dados{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
.dados div{display:flex;flex-direction:column;gap:6px}
.dados div+div{border-left:2px solid var(--borda)}
.dados small{font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2)}
.dados strong{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05}
.frase{margin-top:auto;margin-bottom:auto;align-self:flex-start;font-family:var(--display);font-weight:900;font-size:66px;line-height:1.02;letter-spacing:-.02em;color:#fff}
.frase span{color:var(--acai)}
.base{margin-top:0;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:28px;color:#fff}
.link{font-family:var(--display);font-weight:900;font-size:58px;line-height:.95;letter-spacing:-.01em}
.link small{display:block;font-family:var(--body);font-weight:700;font-size:26px;letter-spacing:0;margin-top:12px;opacity:.95}
.info{font-family:var(--display);font-weight:900;font-size:44px;line-height:1.1;letter-spacing:-.01em}
.info span{font-family:var(--body);font-weight:700;font-size:28px;letter-spacing:0;opacity:.95}
.base{align-items:center}
.tag{display:flex;align-items:center;gap:16px;background:var(--creme);color:var(--acai);border-radius:20px;padding:16px 24px 16px 16px;max-width:430px}
.tag i{flex:none;width:58px;height:58px;border-radius:50%;background:var(--acai);color:#fff;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:900;font-size:30px;padding-bottom:4px}
.tag span{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.15}
</style>
</head>
<body>
<div class="post">
  <div class="topo">
    <div class="marca">Maria Pitanga<small>Capistrano</small></div>
    <div class="gratis">Inscrição gratuita</div>
  </div>
  <div class="peito">
    <div class="peito-topo"><i class="furo"></i><span>Treinão de reinauguração</span><i class="furo"></i></div>
    <div class="peito-corpo">
      <div class="rotulo">Inscrições abrem</div>
      <div class="numero">16<i>/</i>10</div>
      <div class="amanha">É amanhã!</div>
      <div class="corte"></div>
      <div class="dados">
        <div><small>Quinta</small><strong>22/10</strong></div>
        <div><small>Concentr.</small><strong>19h</strong></div>
        <div><small>Largada</small><strong>19h30</strong></div>
        <div><small>Distância</small><strong>3 km</strong></div>
      </div>
    </div>
  </div>
  <div class="frase">Prepara o tênis.<br><span>Dia 22 tem treinão.</span></div>
  <div class="base">
    <div class="info">200 vagas<br><span>Açaí grátis na chegada</span></div>
    <div class="tag"><i aria-hidden="true">@</i><span>Marca quem vai correr com você</span></div>
  </div>
</div>
</body>
</html>
